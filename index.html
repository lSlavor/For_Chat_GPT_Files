
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lSlavor — File Explorer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 20px;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
}

main {
    max-width: 900px;
    margin: auto;
}

header {
    margin-bottom: 28px;
}

h1 {
    font-size: 27px;
    margin: 0 0 8px;
}

.subtitle {
    color: #8b949e;
    font-size: 14px;
}

.search {
    width: 100%;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
}

.search:focus {
    border-color: #388bfd;
}

.status {
    color: #8b949e;
    font-size: 13px;
    margin-bottom: 14px;
}

.tree {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
}

.folder {
    margin: 3px 0;
}

.folder summary {
    list-style: none;
    cursor: pointer;
    padding: 9px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
}

.folder summary::-webkit-details-marker {
    display: none;
}

.folder summary::before {
    content: "▸";
    color: #8b949e;
    display: inline-block;
    width: 20px;
}

.folder[open] > summary::before {
    content: "▾";
}

.folder summary:hover,
.file:hover {
    background: #21262d;
}

.folder-content {
    margin-left: 20px;
    padding-left: 12px;
    border-left: 1px solid #30363d;
}

.file {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px;
    margin: 2px 0;
    border-radius: 6px;
    text-decoration: none;
    color: #58a6ff;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.file:hover {
    color: #79c0ff;
}

.file-icon {
    width: 22px;
    flex-shrink: 0;
}

.message {
    padding: 15px;
    color: #8b949e;
    font-size: 14px;
}

footer {
    text-align: center;
    color: #6e7681;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>
<main>

<header>
    <h1>📁 lSlavor</h1>
    <div class="subtitle">
        Personal File Explorer · GitHub Repository
    </div>
</header>

<input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Поиск файлов и папок..."
>

<div class="status" id="status">
    Загрузка файлов...
</div>

<div class="tree" id="tree">
    <div class="message">Загрузка...</div>
</div>

<footer>
    Powered by GitHub API
</footer>

</main>

<script>
const OWNER = "lSlavor";
const REPO = "For_Chat_GPT_Files";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/main?recursive=1`;

const SITE_URL =
    "https://lslavor.github.io/For_Chat_GPT_Files/";

const treeElement = document.getElementById("tree");
const statusElement = document.getElementById("status");
const searchElement = document.getElementById("search");

let rootTree = null;

// Создаём узел дерева
function createNode(name, path = "") {
    return {
        name,
        path,
        dirs: new Map(),
        files: []
    };
}

// Собираем дерево папок и файлов
function buildTree(items) {
    const root = createNode("ROOT");

    for (const item of items) {
        if (item.type !== "blob") continue;

        const parts = item.path.split("/");
        const fileName = parts.pop();

        let current = root;
        let currentPath = "";

        for (const part of parts) {
            currentPath = currentPath
                ? currentPath + "/" + part
                : part;

            if (!current.dirs.has(part)) {
                current.dirs.set(
                    part,
                    createNode(part, currentPath)
                );
            }

            current = current.dirs.get(part);
        }

        current.files.push({
            name: fileName,
            path: item.path
        });
    }

    return root;
}

// Проверяем совпадения с поиском
function hasMatch(node, query) {
    if (!query) return true;

    if (node.name.toLowerCase().includes(query)) {
        return true;
    }

    if (node.files.some(file =>
        file.path.toLowerCase().includes(query)
    )) {
        return true;
    }

    return [...node.dirs.values()]
        .some(dir => hasMatch(dir, query));
}

// Иконки для разных типов файлов
function getIcon(name) {
    const ext = name.split(".").pop().toLowerCase();

    if (ext === "pdf") return "📕";

    if (["doc", "docx"].includes(ext))
        return "📘";

    if (["xls", "xlsx", "csv"].includes(ext))
        return "📗";

    if (["jpg", "jpeg", "png", "gif", "webp", "svg"].includes(ext))
        return "🖼️";

    if (["html", "css", "js", "json", "py", "cs"].includes(ext))
        return "📄";

    if (["zip", "rar", "7z"].includes(ext))
        return "📦";

    if (["mp4", "mp3", "wav"].includes(ext))
        return "🎬";

    return "📄";
}

// Безопасно формируем адрес файла
function getFileUrl(path) {
    const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    return SITE_URL + encodedPath;
}

// Отрисовываем содержимое папки
function renderDirectory(node, container, query) {

    // Сначала папки
    const dirs = [...node.dirs.values()].sort(
        (a, b) => a.name.localeCompare(b.name, "ru")
    );

    for (const dir of dirs) {
        if (!hasMatch(dir, query)) continue;

        const details = document.createElement("details");
        details.className = "folder";

        // При активном поиске раскрываем папки
        if (query) details.open = true;

        const summary = document.createElement("summary");
        summary.textContent = "📁 " + dir.name;

        details.appendChild(summary);

        const content = document.createElement("div");
        content.className = "folder-content";

        renderDirectory(dir, content, query);

        details.appendChild(content);
        container.appendChild(details);
    }

    // Затем файлы
    const files = [...node.files].sort(
        (a, b) => a.name.localeCompare(b.name, "ru")
    );

    for (const file of files) {
        if (
            query &&
            !file.path.toLowerCase().includes(query)
        ) continue;

        const link = document.createElement("a");
        link.className = "file";

        link.href = getFileUrl(file.path);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.title = file.path;

        const icon = document.createElement("span");
        icon.className = "file-icon";
        icon.textContent = getIcon(file.name);

        const name = document.createElement("span");
        name.textContent = file.name;

        link.append(icon, name);
        container.appendChild(link);
    }
}

// Обновляем дерево
function renderTree() {
    if (!rootTree) return;

    const query = searchElement.value
        .trim()
        .toLowerCase();

    treeElement.replaceChildren();

    renderDirectory(rootTree, treeElement, query);

    if (!treeElement.hasChildNodes()) {
        const empty = document.createElement("div");
        empty.className = "message";
        empty.textContent = "Ничего не найдено";
        treeElement.appendChild(empty);
    }
}

// Получаем данные GitHub
async function loadRepository() {
    try {
        const response = await fetch(API_URL, {
            headers: {
                Accept: "application/vnd.github+json"
            }
        });

        if (!response.ok) {
            throw new Error(
                `Ошибка GitHub API: ${response.status}`
            );
        }

        const data = await response.json();

        if (data.truncated) {
            statusElement.textContent =
                "Внимание: дерево репозитория неполное";
        }

        const files = data.tree.filter(
            item => item.type === "blob"
        );

        rootTree = buildTree(files);

        renderTree();

        statusElement.textContent =
            `${files.length} файлов · Ветка: main`;

        if (data.truncated) {
            statusElement.textContent += " · Список неполный";
        }

    } catch (error) {
        statusElement.textContent = "Не удалось загрузить файлы";

        treeElement.textContent =
            error.message +
            ". Проверьте доступность репозитория и GitHub API.";
    }
}

// Поиск в реальном времени
searchElement.addEventListener("input", renderTree);

// Запуск
loadRepository();
</script>

</body>
</html>
